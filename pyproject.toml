[project]
name = "curium"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sanchopansa", email = "sashaleb2006@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.156.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.0",
    "poethepoet>=0.49.0",
    "ruff>=0.17.1",
]

[tool.poe.tasks]
start = "uvicorn curium.app:app --port 8000"

[tool.basedpyright]
venvPath = "."
venv = ".venv"
extraPaths = ["src"]
